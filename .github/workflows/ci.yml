# Lint and unit tests on the supported PHP versions, then a build, smoke test
# and vulnerability scan of the Docker image. Third-party actions are pinned
# to a commit.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: racktables_unittest
          MARIADB_USER: racktables
          MARIADB_PASSWORD: racktables
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, gd, bcmath, ldap
          ini-values: error_reporting=E_ALL, display_errors=On
          tools: phpunit:9
          coverage: none
      - name: Lint
        run: |
          find wwwroot plugins tests -name '*.php' -print0 | xargs -0 -n1 php -l > lint.log || { grep -v '^No syntax errors' lint.log; exit 1; }
      - name: Create the test database
        run: |
          mysql -h 127.0.0.1 -u root -proot -e "ALTER DATABASE racktables_unittest CHARACTER SET utf8mb3 COLLATE utf8mb3_general_ci"
          cat > wwwroot/inc/secret.php <<'PHP'
          <?php
          $pdo_dsn = 'mysql:host=127.0.0.1;port=3306;dbname=racktables_unittest';
          $db_username = 'racktables';
          $db_password = 'racktables';
          PHP
          php -r "chdir ('wwwroot'); require 'inc/pre-init.php'; require 'inc/dictionary.php'; require 'inc/config.php'; require 'inc/install.php'; ob_start(); \$ok = init_database_static(); \$out = ob_get_clean(); if (! \$ok || FALSE !== strpos (\$out, 'failed')) { echo strip_tags (\$out); exit (1); }"
          mysql -h 127.0.0.1 -u root -proot racktables_unittest -e "INSERT INTO UserAccount (user_id, user_name, user_password_hash) VALUES (1, 'admin', SHA1('racktables'))"
      - name: PHPUnit
        working-directory: tests
        run: phpunit --do-not-cache-result --exclude-group large

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and start
        run: |
          ./docker/make-secrets.sh > /dev/null
          docker compose up -d --build --wait
      - name: Smoke test
        run: |
          curl -fsS http://127.0.0.1:8080/index.php | grep -q 'name="password"'
          curl -fsSI http://127.0.0.1:8080/index.php | grep -qi "content-security-policy: default-src 'self'"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/inc/secret.php)" = 403
      - name: Logs
        if: failure()
        run: docker compose logs
      - name: Scan the image (fixable HIGH and CRITICAL vulnerabilities)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.1 \
            image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL --scanners vuln racktables:0.22.1
