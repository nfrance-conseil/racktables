<VirtualHost *:8080>
	DocumentRoot /var/www/racktables/wwwroot

	<Directory /var/www/racktables/wwwroot>
		Options None
		AllowOverride None
		Require all granted
		DirectoryIndex index.php
		# index.php is the only entry point, the other PHP files are libraries.
		<FilesMatch "\.php$">
			Require all denied
		</FilesMatch>
		<Files "index.php">
			Require all granted
		</Files>
	</Directory>

	# Libraries and secret.php are never served.
	<Directory /var/www/racktables/wwwroot/inc>
		Require all denied
	</Directory>

	# The application sends its own security headers, these cover static files.
	Header setifempty X-Content-Type-Options "nosniff"
	Header setifempty X-Frame-Options "DENY"
	Header setifempty Referrer-Policy "same-origin"

	ErrorLog /proc/self/fd/2
	CustomLog /proc/self/fd/1 combined
</VirtualHost>
